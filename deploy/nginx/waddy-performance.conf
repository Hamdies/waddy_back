# Drop-in for /etc/nginx/conf.d/ — http context.
#
# Ubuntu's nginx.conf already does `include /etc/nginx/conf.d/*.conf;`, so this
# file applies without editing any existing config. Everything here is global
# and additive; nothing in it overrides a server block.
#
# The two directives that CANNOT live here (http2, and the /storage location)
# are server-context and must go in sites-available/waddyapp.com. See
# deploy/nginx/README.md.

# ---------------------------------------------------------------------------
# Compression
# ---------------------------------------------------------------------------
# Measured on this API: a 10,982 B store listing compresses to 1,872 B — 83%
# saved on every response, which on Egyptian mobile data is the single largest
# transport win available.
#
# comp_level 5 is deliberate. Level 9 costs noticeably more CPU for ~2% more
# compression, and CPU is the constrained resource on this box (4 cores, see
# AUDIT.md §2.3).
# NOTE: `gzip on;` is deliberately absent. Ubuntu's stock nginx.conf already
# sets it, and nginx rejects a duplicate. What it does NOT set is gzip_types,
# which defaults to text/html only — so gzip was "on" while every JSON response
# went out uncompressed. The directives below are the ones that actually matter.
gzip_vary           on;
gzip_proxied        any;
gzip_comp_level     5;
gzip_min_length     256;
gzip_buffers        16 8k;

# Deliberately excludes png/jpeg/webp/zip — those are already compressed, so
# gzipping them burns CPU for nothing. text/html is always gzipped by nginx and
# does not need listing.
gzip_types
    application/json
    application/ld+json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/rss+xml
    application/vnd.api+json
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# ---------------------------------------------------------------------------
# TLS handshake cost
# ---------------------------------------------------------------------------
# Measured: TCP connect 71ms, TLS complete at 159ms — the handshake alone costs
# ~88ms. Session resumption turns that into an abbreviated handshake for
# returning clients, which is most of your traffic.
ssl_session_cache    shared:SSL:10m;   # ~40,000 sessions
ssl_session_timeout  1d;
ssl_session_tickets  off;              # off is the safer default: tickets need
                                       # key rotation to preserve forward secrecy

# OCSP stapling is deliberately NOT enabled here.
#
# Let's Encrypt stopped including an OCSP responder URL in its certificates
# (they moved to CRLs), so nginx has nothing to staple and logs
#   "ssl_stapling" ignored, no OCSP responder URL in the certificate
# on every config test and reload. The directive would be pure noise.
#
# Nothing is lost: with no OCSP URL in the certificate, clients do not make the
# revocation request that stapling exists to save.
